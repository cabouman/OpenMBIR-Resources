name: Refresh usage page

# Regathers the download and star counts and redraws docs/usage/index.html
# on the first day of each month.  It can also be run by hand from the
# Actions tab.  GitHub Pages serves the result.

on:
  schedule:
    - cron: "23 5 1 * *"   # 05:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gather the counts and draw the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 docs/usage/fetch_usage_data.py
          python3 docs/usage/make_usage_page.py

      - name: Commit the refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/usage/usage_data.json docs/usage/index.html
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Refresh the usage page ($(date -u +%Y-%m-%d))"
            git push
          fi
